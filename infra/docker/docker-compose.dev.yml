services:
  postgres:
    # pgvector build of Postgres 16 (P15-T09): the retrieval track's
    # CREATE EXTENSION vector migration fails on plain postgres:16-alpine.
    image: pgvector/pgvector:pg16
    container_name: hms-postgres
    environment:
      POSTGRES_DB: hms_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - hms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hms_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for the document store (P15-T10). The same
  # AWS SDK v3 client serves MinIO here and real S3 in cloud production — the
  # only difference is the endpoint plus forced path-style addressing, because
  # MinIO does not do virtual-host buckets on a bare host name.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hms-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-hmsdevaccess}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-hmsdevsecret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - hms-minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    command: ['server', '/data', '--console-address', ':9001']

  # Creates the bucket once and exits. MinIO has no "create bucket on boot"
  # setting, and an API that boots against a missing bucket fails on the first
  # upload rather than at startup — a failure mode that reads as a broken
  # feature instead of a missing container.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: hms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY_ID:-hmsdevaccess}" "${S3_SECRET_ACCESS_KEY:-hmsdevsecret}" &&
        mc mb --ignore-existing local/"${S3_BUCKET:-hms-dev-objects}"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile.dev
    container_name: hms-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hms_dev?schema=public
      PORT: 3001
      # Dev-only identifier encryption keys. Never reuse these outside local docker.
      PATIENT_PII_ENCRYPTION_KEY: ${PATIENT_PII_ENCRYPTION_KEY:-ZGV2LW9ubHktcGF0aWVudC1waWktZW5jLWtleS0wMDE=}
      PATIENT_PII_INDEX_KEY: ${PATIENT_PII_INDEX_KEY:-ZGV2LW9ubHktcGF0aWVudC1waWktaWR4LWtleS0wMDE=}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET: ${S3_BUCKET:-hms-dev-objects}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-hmsdevaccess}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-hmsdevsecret}
      # Ollama runs on the developer's host, not in this network — the same
      # `host.docker.internal` trap already documented for chat.
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      DOCUMENT_INGESTION_ENABLED: ${DOCUMENT_INGESTION_ENABLED:-false}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    command: ['pnpm', '--filter', '@hms/api', 'dev']

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile.dev
    container_name: hms-migrate
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hms_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@hms/api', 'prisma:migrate:deploy']

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile.dev
    container_name: hms-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    command: ['pnpm', '--filter', '@hms/web', 'dev', '--', '--hostname', '0.0.0.0', '--port', '3000']

volumes:
  hms-postgres-data:
  hms-minio-data:
