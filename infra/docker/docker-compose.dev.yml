services:
  postgres:
    # pgvector build of Postgres 16 (P15-T09): the retrieval track's
    # CREATE EXTENSION vector migration fails on plain postgres:16-alpine.
    image: pgvector/pgvector:pg16
    container_name: hms-postgres
    environment:
      POSTGRES_DB: hms_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - hms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hms_dev']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage for the document store (P15-T10). The same
  # AWS SDK v3 client serves MinIO here and real S3 in cloud production — the
  # only difference is the endpoint plus forced path-style addressing, because
  # MinIO does not do virtual-host buckets on a bare host name.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hms-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-hmsdevaccess}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-hmsdevsecret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - hms-minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    command: ['server', '/data', '--console-address', ':9001']

  # Creates the bucket once and exits. MinIO has no "create bucket on boot"
  # setting, and an API that boots against a missing bucket fails on the first
  # upload rather than at startup — a failure mode that reads as a broken
  # feature instead of a missing container.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: hms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY_ID:-hmsdevaccess}" "${S3_SECRET_ACCESS_KEY:-hmsdevsecret}" &&
        mc mb --ignore-existing local/"${S3_BUCKET:-hms-dev-objects}"

  # The self-hosted WhatsApp bridge (PCS-T09, D-CS-01). Behind the `whatsapp`
  # profile because it is opt-in: it drives a real WhatsApp Web session, and a
  # container that boots by default would have every developer's `docker
  # compose up` waiting on a QR scan for a number they do not have.
  #
  # Three things about this service are load-bearing rather than incidental:
  #
  #   * **No `ports:` mapping.** The REST port is reachable only from this
  #     compose network, which the API is also on. GOWA's API can send as the
  #     clinic and read its session — publishing it to the host, and from there
  #     to whatever the host is exposed on, is the single worst mistake
  #     available here. Reach it in development with `docker compose exec` or a
  #     temporary `docker run --network` sidecar, never by adding a port.
  #   * **The session volume is persisted.** GOWA stores the paired-device
  #     credentials under /app/storages; losing it means re-scanning a QR code
  #     against a production WhatsApp number, which §8.4 names as the top
  #     operational failure mode.
  #   * **Basic auth is on.** Defaulted here for local convenience only — the
  #     runbook requires a generated credential in any deployment that is not
  #     one developer's laptop.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: hms-gowa
    # Per-bridge profiles rather than one `whatsapp` profile (`PCS-T10`):
    # only one bridge may hold the clinic's number at a time, and a profile
    # that started both would have two containers racing for the same paired
    # session. The API's WA_GATEWAY_KIND has to agree with whichever is up.
    profiles: ['whatsapp-gowa']
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      APP_BASIC_AUTH: '${WA_GATEWAY_BASIC_AUTH_USERNAME:-hmsdev}:${WA_GATEWAY_BASIC_AUTH_PASSWORD:-hmsdevsecret}'
      APP_OS: Chrome
      # `api` resolves on this network; the webhook never leaves it.
      WHATSAPP_WEBHOOK: http://api:3001/api/v1/channels/whatsapp/webhook
      WHATSAPP_WEBHOOK_SECRET: ${WA_GATEWAY_WEBHOOK_SECRET:-hms-dev-webhook-secret}
      # Refuses to send to a number that is not on WhatsApp instead of
      # silently succeeding — on a channel whose replies are booking
      # confirmations, a send that reports success and never arrives is worse
      # than one that fails.
      WHATSAPP_ACCOUNT_VALIDATION: 'true'
    volumes:
      - hms-gowa-session:/app/storages
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/app/devices || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # The documented fallback (PCS-T10, D-CS-01). Same private-network posture as
  # GOWA above and for the same reasons — no published port, auth on, session
  # volume persisted — because the risk is identical: whoever reaches this
  # container can send as the clinic.
  #
  # Bring it up *instead of* gowa, not alongside it, and set
  # WA_GATEWAY_KIND=WAHA so the API reads WAHA's webhook shape. Conversations
  # survive the switch: both bridges' chat ids canonicalise to one stored form.
  waha:
    image: devlikeapro/waha:latest
    container_name: hms-waha
    profiles: ['whatsapp-waha']
    restart: unless-stopped
    environment:
      WHATSAPP_API_KEY: ${WA_GATEWAY_API_KEY:-hmsdevwahakey}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # `api` resolves on this network; the webhook never leaves it. The URL is
      # the same one GOWA posts to — one route serves both bridges, so a
      # failover does not also mean editing a running container's webhook.
      WHATSAPP_HOOK_URL: http://api:3001/api/v1/channels/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WA_GATEWAY_WEBHOOK_SECRET:-hms-dev-webhook-secret}
    volumes:
      - hms-waha-session:/app/.sessions
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/sessions || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile.dev
    container_name: hms-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hms_dev?schema=public
      PORT: 3001
      # Dev-only identifier encryption keys. Never reuse these outside local docker.
      PATIENT_PII_ENCRYPTION_KEY: ${PATIENT_PII_ENCRYPTION_KEY:-ZGV2LW9ubHktcGF0aWVudC1waWktZW5jLWtleS0wMDE=}
      PATIENT_PII_INDEX_KEY: ${PATIENT_PII_INDEX_KEY:-ZGV2LW9ubHktcGF0aWVudC1waWktaWR4LWtleS0wMDE=}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET: ${S3_BUCKET:-hms-dev-objects}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-hmsdevaccess}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-hmsdevsecret}
      # Which embedder is bound (PCS-T12, D-EMB-01). Defaults to OLLAMA *here*
      # rather than to the application default of TOGETHER: a dev stack that
      # silently shipped every ingested document to a third party the first
      # time somebody exported a TOGETHER_API_KEY would be a bad surprise, and
      # a compose file is exactly the place to be conservative about it.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-OLLAMA}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      TOGETHER_EMBEDDING_MODEL: ${TOGETHER_EMBEDDING_MODEL:-intfloat/multilingual-e5-large-instruct}
      # Ollama runs on the developer's host, not in this network — the same
      # `host.docker.internal` trap already documented for chat.
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      DOCUMENT_INGESTION_ENABLED: ${DOCUMENT_INGESTION_ENABLED:-false}
      # The WhatsApp bridge, addressed by service name on the private network.
      # Set even when the `whatsapp` profile is not up: the adapter refuses to
      # send rather than failing at boot, so a configured-but-absent gateway is
      # a ServiceUnavailable on one reply, not a dead API.
      WA_GATEWAY_KIND: ${WA_GATEWAY_KIND:-GOWA}
      WA_GATEWAY_BASE_URL: ${WA_GATEWAY_BASE_URL:-http://gowa:3000}
      WA_GATEWAY_BASIC_AUTH_USERNAME: ${WA_GATEWAY_BASIC_AUTH_USERNAME:-hmsdev}
      WA_GATEWAY_BASIC_AUTH_PASSWORD: ${WA_GATEWAY_BASIC_AUTH_PASSWORD:-hmsdevsecret}
      WA_GATEWAY_WEBHOOK_SECRET: ${WA_GATEWAY_WEBHOOK_SECRET:-hms-dev-webhook-secret}
      WA_GATEWAY_DEVICE_ID: ${WA_GATEWAY_DEVICE_ID:-}
      # WAHA's credential and session name. Unset on a GOWA deployment and
      # harmless there — the adapter that reads them is constructed either way
      # but only one is bound.
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-hmsdevwahakey}
      WA_GATEWAY_SESSION_NAME: ${WA_GATEWAY_SESSION_NAME:-default}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    command: ['pnpm', '--filter', '@hms/api', 'dev']

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile.dev
    container_name: hms-migrate
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hms_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@hms/api', 'prisma:migrate:deploy']

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile.dev
    container_name: hms-web
    environment:
      # `-` not `:-`, deliberately: an explicitly empty value must survive.
      # Behind the `tls` proxy the API is same-origin at /api, and empty is how
      # the client is told to use relative URLs. `:-` would override that with
      # the localhost default and send browser traffic straight past the proxy.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-http://localhost:3001}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    command: ['pnpm', '--filter', '@hms/web', 'dev', '--', '--hostname', '0.0.0.0', '--port', '3000']

  # TLS termination (SJ-1). Behind the `tls` profile because the everyday loop
  # is `localhost:3000` against `localhost:3001` and forcing a proxy into that
  # buys nothing. What it buys when you *do* turn it on is that the proxy path
  # gets exercised before production meets it: `Secure` cookies, `request.ip`
  # arriving via X-Forwarded-For, and Next.js building absolute URLs from the
  # forwarded host all behave here the way they will behave behind the real
  # certificate.
  #
  #   docker compose -f infra/docker/docker-compose.dev.yml --profile tls up
  #
  # Uses Caddyfile.dev, which issues from Caddy's own CA — no domain, no DNS
  # token, no outbound network. The production Caddyfile alongside it needs all
  # three; see docs/security/tls.md.
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: hms-caddy
    profiles: ['tls']
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Named rather than anonymous so a
      # `docker compose down` does not throw away the local CA and make every
      # developer re-trust a new root.
      - hms-caddy-data:/data
      - hms-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --no-check-certificate https://localhost/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hms-postgres-data:
  hms-minio-data:
  hms-caddy-data:
  hms-caddy-config:
  # Paired-device credentials. Losing either volume means re-scanning a QR code
  # against a live WhatsApp number (§8.4). They are separate because the two
  # bridges store incompatible session state — a failover is a re-pair, which
  # the runbook says out loud.
  hms-gowa-session:
  hms-waha-session:
