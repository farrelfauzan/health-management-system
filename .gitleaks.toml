# SJ-5 — secret scanning configuration.
#
# Extends the upstream ruleset rather than replacing it: the default rules
# recognise the credential formats that actually matter here (cloud keys,
# private keys, provider tokens), and a hand-rolled list would rot.
#
# The allowlist below is short on purpose. A scanner that cries wolf is a
# scanner somebody switches off, but every entry is a place where a *real*
# secret would then go unnoticed — so each one has to be a location where a
# real secret cannot live.

[extend]
useDefault = true

[allowlist]
description = "Paths and literals that cannot contain a real credential"

paths = [
  # Prisma generates a base64-encoded schema graph here. It is high-entropy by
  # construction and trips entropy rules on every run; it is also machine-
  # written from schema.prisma, so a human secret cannot reach it.
  '''apps/api/src/generated/''',
  # Integrity hashes, not credentials.
  '''pnpm-lock\.yaml''',
  # Placeholders, and the file is the documented place for them. The values
  # themselves are additionally refused at boot when NODE_ENV=production —
  # see validateEnvironment.
  '''apps/api/\.env\.example''',
]

regexes = [
  # The well-known development values. They are in the repository on purpose
  # (docker-compose defaults, CI fixtures) and are rejected in production by
  # validateEnvironment, so a leak of one grants nothing.
  '''dev-access-secret''',
  '''dev-refresh-secret''',
  '''replace-with-strong-secret''',
  '''hmsdevaccess''',
  '''hmsdevsecret''',
  '''hmsdevwahakey''',
  '''hms-dev-webhook-secret''',
  # The single-host dev database credential pair, which is `postgres/postgres`
  # on a container bound to localhost.
  '''postgresql://postgres:postgres@''',

  # Test fixtures for the BPJS and AI-provider credential paths. Allowlisted by
  # *value*, not by file: a spec is precisely where somebody pastes a real key
  # "just to debug the integration", so `*.spec.ts` stays scanned and only
  # these six known-synthetic strings are exempt. Each was checked against the
  # commit that introduced it — none was ever a real credential later swapped
  # for a fixture.
  #
  #   b1a2c3... — a hand-walked hex sequence (b1 a2 c3 d4 e5 f6 07 18 ...)
  #   0kSp1ke... — leetspeak "OkSpikeSecretKey"
  #   sk-proj-abc123def456 — too short to be a real key, and says so
  #   RahasiaPcare123 — "SecretPcare123" in Indonesian, for `klinik-demo`
  #   a2xpbmlr... — base64 of `klinik-demo:RahasiaPcare123:095`, which is the
  #     *expected output* the header test asserts, not an input credential
  '''b1a2c3d4e5f60718293a4b5c6d7e8f90''',
  '''0kSp1keSecretKey''',
  '''sk-proj-abc123def456''',
  '''RahasiaPcare123''',
  '''a2xpbmlrLWRlbW86UmFoYXNpYVBjYXJlMTIzOjA5NQ==''',
]
