        "200":
          description: ""
      tags:
        - Health
info:
  title: HMS API
  description: Health Management System API
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CreateAdminUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        isActive:
          type: boolean
          default: true
        roleCodes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
      required:
        - email
        - password
        - roleCodes
    UpdateAdminUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        isActive:
          type: boolean
        roleCodes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    CreatePatientDto:
      type: object
      properties:
        mrn:
          type: string
          minLength: 3
          maxLength: 64
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        dateOfBirth:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        phoneNumber:
          type: string
          minLength: 6
          maxLength: 32
        address:
          type: string
          minLength: 3
          maxLength: 300
        ownerUserId:
          type: string
          format: uuid
        isActive:
          type: boolean
          default: true
        doctorIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
      required:
        - mrn
        - fullName
        - dateOfBirth
        - phoneNumber
        - address
    UpdatePatientDto:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        dateOfBirth:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        phoneNumber:
          type: string
          minLength: 6
          maxLength: 32
        address:
          type: string
          minLength: 3
          maxLength: 300
        ownerUserId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
    CreateDoctorPatientAssignmentDto:
      type: object
      properties:
        doctorId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
      required:
        - doctorId
        - patientId
    AssignRoleDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          minLength: 1
      required:
        - userId
        - roleCode
    UnassignRoleDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          minLength: 1
      required:
        - userId
        - roleCode
