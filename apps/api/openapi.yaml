      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnassignRoleDto"
            examples:
              default:
                summary: Valid request
                value:
                  userId: 33333333-3333-4333-8333-333333333333
                  roleCode: ADMIN
      responses:
        "200":
          description: The revoked role assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      userId:
                        type: string
                      roleId:
                        type: string
                      unassignedAt:
                        type: string
                    required:
                      - id
                      - userId
                      - roleId
                      - unassignedAt
                  message:
                    type: string
                required:
                  - data
                  - message
                example:
                  data:
                    id: abababab-abab-4bab-8bab-abababababab
                    userId: 33333333-3333-4333-8333-333333333333
                    roleId: ffffffff-ffff-4fff-8fff-ffffffffffff
                    unassignedAt: 2026-07-20T08:00:00.000Z
                  message: Role unassigned
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    message: Request validation failed
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Authentication is required
        "403":
          description: The authenticated user does not have the required permission.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: FORBIDDEN
                    message: Insufficient permission
        "404":
          description: Role assignment not found.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: NOT_FOUND
                    message: Role assignment not found.
      security:
        - bearer: []
      summary: Unassign a role from a user
      tags: *a10
  /api/v1/health:
    get:
      operationId: HealthController_getHealth_v1
      parameters: []
      responses:
        "200":
          description: Static liveness payload for probes and uptime checks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                required:
                  - status
                  - service
                example:
                  status: ok
                  service: api
      summary: Check API liveness
      tags:
        - Health
