                example:
                  data:
                    id: 33333333-3333-4333-8333-333333333333
                    email: admin@example.com
                    isActive: true
                    createdAt: 2026-07-20T08:00:00.000Z
                    updatedAt: 2026-07-20T08:00:00.000Z
                    roles:
                      - code: ADMIN
