  /api/v1/bpjs/eligibility/patients/{patientId}/check:
    post:
      operationId: BpjsEligibilityController_checkEligibility_v1
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckBpjsEligibilityDto"
            examples:
              default:
                summary: Valid request
                value:
                  force: false
      responses:
        "200":
          description: "The membership state for the eligibility card: ACTIVE, INACTIVE
            (with BPJS’s readable reason), NOT_FOUND, or UNREACHABLE when PCare
            cannot be contacted — still a 200, because registration must never
            block on BPJS. Results are cached per patient per clinic-local day;
            pass force to bypass the cache after correcting patient data. Looks
            up by the stored BPJS number, falling back to NIK."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      state:
                        type: string
                      isFromCache:
                        type: boolean
                      checkedAt:
                        type: string
                      checkedVia:
                        type: string
                      member:
                        type: object
                        properties:
                          name:
                            type: string
                          memberType:
                            type: string
                          memberClass:
                            type: string
                          providerCode:
                            type: string
                          providerName:
                            type: string
                          isRegisteredHere:
                            type: boolean
                          isProlanis:
                            type: boolean
                          isPrb:
                            type: boolean
                          statusReason:
                            type: string
                        required:
                          - name
                          - memberType
                          - memberClass
                          - providerCode
                          - providerName
                          - isRegisteredHere
                          - isProlanis
                          - isPrb
                          - statusReason
                      message:
                        type: string
                    required:
                      - state
                      - isFromCache
                      - checkedAt
                      - checkedVia
                      - member
                      - message
                required:
                  - data
                example:
                  data:
                    state: ACTIVE
                    isFromCache: false
                    checkedAt: 2026-08-04T01:30:00.000Z
                    checkedVia: BPJS_NUMBER
                    member:
                      name: BUDI SANTOSO
                      memberType: PEKERJA PENERIMA UPAH
                      memberClass: KELAS I
                      providerCode: "01000101"
                      providerName: KLINIK DEMO
                      isRegisteredHere: true
                      isProlanis: false
                      isPrb: false
                      statusReason: AKTIF
                    message: BPJS member is active
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    message: Request validation failed
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Authentication is required
        "403":
          description: The authenticated user does not have the required permission.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: FORBIDDEN
                    message: Insufficient permission
        "404":
          description: Patient not found, or BPJS PCare is not configured.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: NOT_FOUND
                    message: Patient not found, or BPJS PCare is not configured.
      security:
        - bearer: []
      summary: Check a patient’s BPJS eligibility (peserta)
      tags:
        - BPJS PCare
