  /api/v1/doctor-patient-assignments/activity:
    get:
      operationId: DoctorPatientController_listActivity_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            exclusiveMinimum: false
            default: 1
            type: integer
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            exclusiveMaximum: false
            exclusiveMinimum: false
            default: 10
            type: integer
        - name: doctorId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: patientId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
            enum:
              - ASSIGNED
              - UNASSIGNED
        - name: actorUserId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: occurredFrom
          required: false
          in: query
          schema:
            format: date-time
            type: string
        - name: occurredTo
          required: false
          in: query
          schema:
            format: date-time
            type: string
      responses:
