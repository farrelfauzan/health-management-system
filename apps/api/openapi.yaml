            never inside the assistant content — render the reply only together
            with it. Emergency messages are answered from a fixed escalation
            template without contacting any provider. Returns 422 when the
            safety guards refuse the message, 429 on the hourly limit, 502/504
            when the provider fails, and 503 when chat is disabled or
            unconfigured.
