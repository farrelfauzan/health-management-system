openapi: 3.0.0
paths:
  /api/v1/auth/login:
    post:
      operationId: AuthController_login_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
            examples:
              default:
                summary: Valid request
                value:
                  email: admin@example.com
                  password: SecurePassword123!
      responses:
        "200":
          description: Access and refresh tokens for the authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: string
                    required:
                      - accessToken
                      - refreshToken
                      - tokenType
                      - expiresIn
                  message:
                    type: string
                required:
                  - data
                  - message
                example:
                  data:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.access.example
                    refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.example
                    tokenType: Bearer
                    expiresIn: 15m
                  message: Login success
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    message: Request validation failed
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Invalid credentials.
      summary: Log in with email and password
      tags: &a1
        - Auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
            examples:
              default:
                summary: Valid request
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.example
      responses:
        "200":
          description: A new access token and rotated refresh token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      tokenType:
                        type: string
                      expiresIn:
                        type: string
                    required:
                      - accessToken
                      - refreshToken
                      - tokenType
                      - expiresIn
                  message:
                    type: string
                required:
                  - data
                  - message
                example:
                  data:
                    accessToken: eyJhbGciOiJIUzI1NiJ9.access.example
                    refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.example
                    tokenType: Bearer
                    expiresIn: 15m
                  message: Token refreshed
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    message: Request validation failed
        "401":
          description: Invalid refresh token.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Invalid refresh token.
      summary: Rotate a refresh token
      tags: *a1
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutDto"
            examples:
              default:
                summary: Valid request
                value:
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh.example
      responses:
        "200":
          description: Confirmation that the refresh token family was revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                    required:
                      - success
                      - message
                  message:
                    type: string
                required:
                  - data
                  - message
                example:
                  data:
                    success: true
                    message: Logged out
                  message: Logout success
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    message: Request validation failed
        "401":
          description: Invalid refresh token.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Invalid refresh token.
      summary: Log out and revoke the refresh token family
      tags: *a1
  /api/v1/users:
    get:
      operationId: AdminManagementController_listUsers_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            exclusiveMinimum: false
            default: 1
            type: integer
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            exclusiveMaximum: false
            exclusiveMinimum: false
            default: 10
            type: integer
        - name: search
          required: false
          in: query
          schema:
            minLength: 1
            type: string
        - name: roleCode
          required: false
          in: query
          schema:
            minLength: 1
            type: string
        - name: isActive
          required: false
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: A paginated list of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                              name:
                                type: string
                            required:
                              - code
                              - name
                      required:
                        - id
                        - email
                        - isActive
                        - createdAt
                        - updatedAt
                        - roles
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                    required:
                      - page
                      - limit
                      - total
                required:
                  - data
                  - meta
                example:
                  data:
                    - id: 33333333-3333-4333-8333-333333333333
                      email: admin@example.com
                      isActive: true
                      createdAt: 2026-07-20T08:00:00.000Z
                      updatedAt: 2026-07-20T08:00:00.000Z
                      roles:
                        - code: ADMIN
                          name: Administrator
                  meta:
                    page: 1
                    limit: 10
                    total: 1
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Authentication is required
        "403":
          description: The authenticated user does not have the required permission.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: FORBIDDEN
                    message: Insufficient permission
      security:
        - bearer: []
      summary: List admin users
      tags: &a2
        - Admin Management
    post:
      operationId: AdminManagementController_createAdminUser_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserDto"
            examples:
              default:
                summary: Valid request
                value:
                  email: admin@example.com
                  password: SecurePassword123!
                  roleCodes:
                    - ADMIN
                  isActive: true
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      isActive:
                        type: boolean
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                            name:
                              type: string
                          required:
                            - code
                            - name
                    required:
                      - id
                      - email
                      - isActive
                      - createdAt
                      - updatedAt
                      - roles
                  message:
                    type: string
                required:
                  - data
                  - message
                example:
                  data:
                    id: 33333333-3333-4333-8333-333333333333
                    email: admin@example.com
                    isActive: true
                    createdAt: 2026-07-20T08:00:00.000Z
                    updatedAt: 2026-07-20T08:00:00.000Z
                    roles:
                      - code: ADMIN
                        name: Administrator
                  message: User created
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: BAD_REQUEST
                    message: Request validation failed
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: UNAUTHORIZED
                    message: Authentication is required
        "403":
          description: The authenticated user does not have the required permission.
          content:
            application/json:
              schema:
                example:
                  error:
                    code: FORBIDDEN
                    message: Insufficient permission
      security:
        - bearer: []
      summary: Create an admin user
      tags: *a2
  /api/v1/users/{id}:
