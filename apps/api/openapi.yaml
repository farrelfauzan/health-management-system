                    required:
                      - id
                      - registrationId
                      - type
                      - status
                      - attempts
                      - lastError
                      - nextAttemptAt
                      - lastAttemptAt
                      - submittedAt
                      - bpjsReferenceNo
                      - createdAt
                  message:
                    type: string
                required:
                  - data
                  - message
                example:
                  data:
                    id: 8a7b6c5d-4e3f-2a1b-0c9d-8e7f6a5b4c3d
                    registrationId: 1f2e3d4c-5b6a-7980-a1b2-c3d4e5f6a7b8
