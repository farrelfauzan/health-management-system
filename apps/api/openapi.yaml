                        emergencyContactPhone:
                          type: string
                        guardianName:
                          type: string
                        guardianRelation:
                          type: string
                        ownerUserId:
                          type: string
                        isActive:
                          type: boolean
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        doctorCount:
                          type: integer
                        allergyCount:
                          type: integer
                        doctors:
