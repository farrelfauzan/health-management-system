openapi: 3.0.0
paths:
  /api/v1/auth/login:
    post:
      operationId: AuthController_login_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: ""
      tags: &a1
        - Auth
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: ""
      tags: *a1
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutDto"
      responses:
        "200":
          description: ""
      tags: *a1
  /api/v1/users:
    get:
      operationId: AdminManagementController_listUsers_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            exclusiveMinimum: false
            default: 1
            type: integer
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            exclusiveMaximum: false
            exclusiveMinimum: false
            default: 10
            type: integer
        - name: search
          required: false
          in: query
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          description: ""
      tags: &a2
        - AdminManagement
    post:
      operationId: AdminManagementController_createAdminUser_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserDto"
      responses:
        "201":
          description: ""
      tags: *a2
  /api/v1/users/{id}:
    patch:
      operationId: AdminManagementController_updateAdminUser_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserDto"
      responses:
        "200":
          description: ""
      tags: *a2
  /api/v1/rbac/roles:
    get:
      operationId: RbacController_getRoles_v1
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a3
        - Rbac
  /api/v1/rbac/assign-role:
    post:
      operationId: RbacController_assignRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleDto"
      responses:
        "200":
          description: ""
      tags: *a3
  /api/v1/rbac/unassign-role:
    post:
      operationId: RbacController_unassignRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnassignRoleDto"
      responses:
        "200":
          description: ""
      tags: *a3
  /api/v1/health:
    get:
      operationId: HealthController_getHealth_v1
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - Health
info:
  title: HMS API
  description: Health Management System API
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CreateAdminUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        isActive:
          type: boolean
          default: true
        roleCodes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
      required:
        - email
        - password
        - roleCodes
    UpdateAdminUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        isActive:
          type: boolean
        roleCodes:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    AssignRoleDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          minLength: 1
      required:
        - userId
        - roleCode
    UnassignRoleDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        roleCode:
          type: string
          minLength: 1
      required:
        - userId
        - roleCode
