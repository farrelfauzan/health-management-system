name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hms_dev?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm integration:test

      - name: Build
        run: pnpm build

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma migration status
        run: pnpm --filter @hms/api exec prisma migrate status

      - name: API docker build
        run: docker build -f infra/docker/api/Dockerfile.dev .

      - name: Web docker build
        run: docker build -f infra/docker/web/Dockerfile.dev .
