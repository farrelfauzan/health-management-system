name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # SJ-5 — a leak is cheapest to fix before it is merged, so this gates the PR
  # rather than reporting after the fact. It runs as its own job because it
  # needs the full history (`fetch-depth: 0`), which the quality job does not,
  # and because a secret finding should be legible without scrolling past a
  # test log.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Shallow by default; a scan of one commit would miss the case this
          # job exists for — a credential added, then removed in a later
          # commit, and still readable in the objects.
          fetch-depth: 0

      - name: Scan history for secrets
        # Pinned to the upstream image rather than the marketplace action:
        # the action gates organisation use behind a licence key, and a scan
        # that silently stops running is worse than no scan.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --log-opts="--all --full-history" \
            --redact \
            --no-banner \
            --verbose

  quality:
    runs-on: ubuntu-latest
    # A leaked async handle can keep Jest's process alive after the run
    # completes; fail the job instead of holding a runner for six hours.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hms_dev?schema=public
      # SJ-5 removed the `?? 'dev-access-secret'` fallbacks, so a missing JWT
      # secret is now a startup failure rather than a silent weak default —
      # which means CI has to supply it like any other deployment. This is the
      # well-known value the specs sign their fixtures with, and the production
      # checks in `validateEnvironment` reject it outright when
      # NODE_ENV=production. It is a test fixture, not a secret: nothing it
      # signs has any authority outside this runner. (SJ-6 retired
      # JWT_REFRESH_SECRET — refresh tokens are opaque and unsigned.)
      JWT_ACCESS_SECRET: dev-access-secret
      # NOTE: storage configuration is deliberately NOT set here. An
      # unconfigured secret expands to an empty string, and `S3_REGION=""` is
      # a hard startup error in `resolveStorageConfig` (`??` falls back on
      # undefined, not on empty), which takes down AppModule for every
      # integration test rather than just the storage suite. It is scoped to
      # the one step that needs it instead.
    services:
      postgres:
        # pgvector build of Postgres 16 (P15-T09): migrate deploy runs the
        # CREATE EXTENSION vector migration, which plain 16-alpine lacks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hms_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if nc -z localhost 5432; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma migrate deploy
        run: pnpm db:migrate:deploy

      - name: Prisma migration status
        run: pnpm --filter @hms/api exec prisma migrate status

      - name: Prisma schema drift check
        run: pnpm --filter @hms/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # Runs after migrate deploy: MRN allocation is proven against real
      # Postgres, because the row lock that serialises concurrent registrations
      # only exists in the database. The document-store storage round-trip
      # additionally needs the S3 secrets above, and skips without them; the
      # end-to-end ingestion suite needs those plus an embedding host, and
      # skips without either.
      - name: Integration tests
        run: pnpm integration:test
        env:
          # The storage round-trip is opt-in on S3_INTEGRATION_TEST_BUCKET:
          # unset, that one suite skips and the rest of the integration run
          # is unaffected. Point the secret at a dedicated test bucket with a
          # short lifecycle rule — the suite deletes its own fixtures, but a
          # crashed run can leave objects behind.
          S3_INTEGRATION_TEST_BUCKET: ${{ secrets.S3_INTEGRATION_TEST_BUCKET }}
          # Falls back rather than expanding empty: an empty region is a
          # startup error, not a "use the default" signal.
          S3_REGION: ${{ secrets.S3_INTEGRATION_TEST_REGION || 'us-east-1' }}
          # Empty is safe here — `resolveStorageConfig` reads an empty pair as
          # "no static credentials" and hands over to the default AWS
          # provider chain.
          S3_ACCESS_KEY_ID: ${{ secrets.S3_INTEGRATION_TEST_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_INTEGRATION_TEST_SECRET_ACCESS_KEY }}
          # The end-to-end ingestion suite (PCS-T02) needs an embedding host
          # on top of the bucket above and skips unless both are set. No
          # hosted runner has one — a GitHub runner cannot serve bge-m3 in
          # any time worth spending — so this is here for a self-hosted
          # runner or a reachable internal Ollama, and expands empty
          # otherwise, which is the skip.
          EMBEDDING_INTEGRATION_TEST_BASE_URL: ${{ secrets.EMBEDDING_INTEGRATION_TEST_BASE_URL }}

      - name: Build
        run: pnpm build

      - name: API docker build
        run: docker build -f infra/docker/api/Dockerfile.dev .

      - name: Web docker build
        run: docker build -f infra/docker/web/Dockerfile.dev .
