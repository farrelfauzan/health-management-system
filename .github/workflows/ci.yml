name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    # A leaked async handle can keep Jest's process alive after the run
    # completes; fail the job instead of holding a runner for six hours.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hms_dev?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hms_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if nc -z localhost 5432; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Prisma validate
        run: pnpm db:validate

      - name: Prisma migrate deploy
        run: pnpm db:migrate:deploy

      - name: Prisma migration status
        run: pnpm --filter @hms/api exec prisma migrate status

      - name: Prisma schema drift check
        run: pnpm --filter @hms/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # Runs after migrate deploy: MRN allocation is proven against real
      # Postgres, because the row lock that serialises concurrent registrations
      # only exists in the database.
      - name: Integration tests
        run: pnpm integration:test

      - name: Build
        run: pnpm build

      - name: API docker build
        run: docker build -f infra/docker/api/Dockerfile.dev .

      - name: Web docker build
        run: docker build -f infra/docker/web/Dockerfile.dev .
