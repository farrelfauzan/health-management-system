[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = 2026-10-31
reason = """
The affected brace-expansion 1.x copy is only reachable through development
tooling (ESLint, Jest, and Nest CLI). The HMS application does not pass
user-controlled glob patterns to this dependency. Remove this exception when
those upstream dependency chains no longer require minimatch 3.
"""

